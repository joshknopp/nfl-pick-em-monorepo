<div class="container">
  <div class="leaderboard-controls">
    <app-week-selector
      [selectedWeek]="selectedWeek"
      [minWeek]="minWeek"
      [maxWeek]="maxWeek"
      (previous)="goToPreviousWeek()"
      (next)="goToNextWeek()"
    >
      <div class="view-toggle" role="group" aria-label="Leaderboard View Record Mode">
        <button
          type="button"
          class="toggle-btn"
          [class.active]="viewMode === 'season'"
          (click)="setViewMode('season')"
          [attr.aria-pressed]="viewMode === 'season'"
        >
          Season
        </button>
        <button
          type="button"
          class="toggle-btn"
          [class.active]="viewMode === 'week'"
          (click)="setViewMode('week')"
          [attr.aria-pressed]="viewMode === 'week'"
        >
          Week {{ selectedWeek }}
        </button>
      </div>
    </app-week-selector>
  </div>

  <div *ngIf="isLoading" class="text-center">
    <div class="loading-spinner">
      <div class="spinner"></div>
      <p class="text-muted mt-3">Loading leaderboard...</p>
    </div>
  </div>

  <div *ngIf="!isLoading && leaderboardData" class="table-responsive">
    <table class="table table-striped table-bordered">
      <thead>
        <tr>
          <th class="sticky-column">User</th>
          <th>{{ viewMode === 'week' ? 'Week Record' : 'Record' }}</th>
          <th
            *ngFor="let game of leaderboardData.games"
            class="game-header"
            [title]="getGameTooltip(game)"
          >
            <span class="game-teams"
              >{{ game.awayTeam }} &#64; {{ game.homeTeam }}</span
            >
            <br />
            <small>{{
              game.kickoffTime | date : 'E h:mm' : 'America/New_York'
            }}</small>
          </th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="let item of leaderboardData.leaderboard"
          [class.current-user]="item.user.uid === currentUser.uid"
        >
          <td class="sticky-column">
            {{ item.user.displayName || item.user.email }}
          </td>
          <td>{{ getRecordDisplay(item) }}</td>
          <td
            *ngFor="let pick of item.picks; let i = index"
            [ngClass]="{
              'pick-correct':
                getPickResult(pick, leaderboardData.games[i]) === 'correct',
              'pick-incorrect':
                getPickResult(pick, leaderboardData.games[i]) === 'incorrect'
            }"
          >
            <span> {{ pick || '--' }} </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
