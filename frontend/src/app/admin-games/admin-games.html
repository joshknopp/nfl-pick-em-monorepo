<div class="container">
  <app-week-selector
    [selectedWeek]="selectedWeek"
    [minWeek]="minWeek"
    [maxWeek]="maxWeek"
    (previous)="goToPreviousWeek()"
    (next)="goToNextWeek()"
  ></app-week-selector>

  <div *ngIf="filteredGames.length === 0" class="text-center">
    <div class="loading-spinner">
      <div class="spinner"></div>
      <p class="text-muted mt-3">Loading games...</p>
    </div>
  </div>

  <div class="grid grid-auto" *ngIf="filteredGames.length > 0">
    <div
      class="card game-card"
      *ngFor="let game of filteredGames; trackBy: trackGame"
    >
      <div class="card-content">
        <div class="saving-overlay" *ngIf="isSaving.get(getGameId(game))">
          <div class="spinner"></div>
        </div>
        <!-- Game Info Header -->
        <div class="game-header">
          <div class="game-time">
            <span class="text-xs text-light"
              >{{ game.kickoffTime | date:'E, MMM d' }}, {{ game.kickoffTime |
              date:'h:mm a' }}</span
            >
          </div>
        </div>
        <!-- Game Teams -->
        <div class="game-teams">
          <div class="team">{{ game.awayTeam }}</div>
          <div class="vs-divider">
            <span class="vs-text">&#64;</span>
          </div>
          <div class="team">{{ game.homeTeam }}</div>
        </div>
        <!-- Update Form -->
        <div *ngIf="editingGameId === getGameId(game)">
          <input type="datetime-local" [(ngModel)]="newKickoffTime" />
          <button (click)="saveKickoffTime(game)">Save</button>
          <button (click)="cancelEdit()">Cancel</button>
        </div>
        <!-- Update Button -->
        <div *ngIf="editingGameId !== getGameId(game)">
          <button (click)="startEdit(game)" [disabled]="isGameLocked(game)">
            Update
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
